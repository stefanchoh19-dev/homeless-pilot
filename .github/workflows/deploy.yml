name: Deploy Homeless Pilot

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  LAMBDA_IMAGE_NAME: homeless-etl
  DASHBOARD_IMAGE_NAME: homeless-dashboard

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests -v

  deploy:
    name: Build, Push, and Deploy
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get AWS Account ID
        id: aws
        run: |
          echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin ${{ steps.aws.outputs.account_id }}.dkr.ecr.$AWS_REGION.amazonaws.com

      - name: Build Lambda image
        run: |
          docker build -f Dockerfile.lambda -t $LAMBDA_IMAGE_NAME:latest .

      - name: Tag Lambda image
        run: |
          docker tag $LAMBDA_IMAGE_NAME:latest ${{ steps.aws.outputs.account_id }}.dkr.ecr.$AWS_REGION.amazonaws.com/$LAMBDA_IMAGE_NAME:latest

      - name: Push Lambda image
        run: |
          docker push ${{ steps.aws.outputs.account_id }}.dkr.ecr.$AWS_REGION.amazonaws.com/$LAMBDA_IMAGE_NAME:latest

      - name: Build Dashboard image
        run: |
          docker build -f Dockerfile.dashboard -t $DASHBOARD_IMAGE_NAME:latest .

      - name: Tag Dashboard image
        run: |
          docker tag $DASHBOARD_IMAGE_NAME:latest ${{ steps.aws.outputs.account_id }}.dkr.ecr.$AWS_REGION.amazonaws.com/$DASHBOARD_IMAGE_NAME:latest

      - name: Push Dashboard image
        run: |
          docker push ${{ steps.aws.outputs.account_id }}.dkr.ecr.$AWS_REGION.amazonaws.com/$DASHBOARD_IMAGE_NAME:latest

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve

      - name: Update Lambda image
        run: |
          aws lambda update-function-code \
            --function-name homeless-etl \
            --image-uri ${{ steps.aws.outputs.account_id }}.dkr.ecr.$AWS_REGION.amazonaws.com/$LAMBDA_IMAGE_NAME:latest